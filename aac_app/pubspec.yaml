name: voicepath
description: "VoicePath — an offline-first AAC communication app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (offline-first)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Text-to-speech
  flutter_tts: ^4.0.2

  # Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  local_auth: ^2.2.0

  # Backup / import / export
  file_picker: ^10.0.0
  share_plus: ^12.0.2
  archive: ^3.6.1

  # Media handling for custom button photos
  image_picker: ^1.1.2

  # Utilities

  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # No hard-coded interface text: locales are driven by lib/core/l10n.
  # Seed vocabulary lives in lib/core/constants/core_vocabulary.dart as plain
  # Dart data rather than a bundled asset — see that file for why.
  generate: false
